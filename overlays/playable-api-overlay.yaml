- target: $.info
  update:
    x-apievangelist-findings:
      operation_ids: >-
        None of the 41 operations declares an operationId. Nothing in this pipeline invents them;
        every derived artifact keys operations by METHOD + path instead. Adding stable operationIds
        is the single highest-leverage change Playable could make to this contract.
      components_schemas: >-
        components.schemas is empty — every request and response body is inlined per operation, so
        no shape is reusable, referenceable or independently versionable.
      error_model: >-
        Errors are {"message": "..."} with no code and no application/problem+json. Only 400/401/403/404
        are declared; no 5xx and no rate-limit status appear anywhere despite a documented hard limit.
      rate_limit_status: >-
        The 3,600/hour limit and the X-RateLimit-* / Retry-After headers are documented in prose in
        info.description but are not modelled as response headers on any operation.
      idempotency: >-
        No idempotency contract, on a write surface that includes activate, resume, copy and
        send-email-to-winner.
      security_scheme_name: >-
        The oauth2 scheme is named "clientCredentials" — the grant type, not the scheme's identity.
      scope_descriptions: >-
        All 37 scope descriptions are the placeholder string "Grant right to", so the scope map
        carries no semantics an agent or a reviewer can act on.
- target: $.servers
  update:
    x-apievangelist-note: >-
      servers[1] https://api.dev.playable.com is labelled QA. It is declared publicly but no
      documentation explains how to obtain access to it. Treat as provider-internal.
- target: $.tags
  update:
    x-apievangelist-note: >-
      Only oauth and campaigns are declared in tags[]; the media and user tags are used on operations
      but never declared at the document level.
