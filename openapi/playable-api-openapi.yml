      description: |
        This API uploads a media file. Must be POSTed as form-data.

        Requires scope:

        `media.upload`
      security:
        - clientCredentials:
            - media.upload
      requestBody:
        description: |
          Path for the file to be saved at:

          File to be uploaded.
          Allowed extensions and their maximum sizes in kilobytes: 

          'png' => 700, 'jpeg' => 700, 'gif' => 4400, 'jpg' => 700, 'svg' => 4400, 
          'ttf' => 3000, 'pdf' => 4400, 'woff' => 3000, 'woff2' => 3000, 'eot' => 3000,
          'txt' => 700, 'doc' => 700, 'xls' => 4400, 'xlsx' => 4400, 'ico' => 700,
          'mp3' => 3000, 'xml' => 4400, 'webp' => 500
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                path:
                  type: string
                file:
                  type: string
                  format: binary
              required:
                - path
