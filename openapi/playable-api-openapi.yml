  /v1/user/create-login-token:
    post:
      tags:
        - user
      summary: Create login user token
      description: |
        This API creates a single-use token for signing into the platform.
        Example of token usage: https://app.playable.com/?loginToken=xyz

        Requires scope:

        `user.create-login-token`
      security:
        - clientCredentials:
            - user.create-login-token
      requestBody:
        description: |
          Role of user. 

          Can be either Basic, BasicNoSubscriberData or Admin. 

          Example: "role": "Basic"
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum:
                    - Basic
                    - BasicNoSubscriberData
                    - Admin
              required:
                - firstName
                - lastName
                - email
                - role
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
