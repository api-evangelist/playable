aid: playable
name: Playable
description: >-
  Playable (formerly Leadfamly, Playable ApS, Aarhus Denmark and London UK) is a self-service marketing
  gamification platform used by brands to build, publish and measure interactive campaigns — spin-the-wheel,
  advent calendars, quizzes, scratch cards, memory and skill games — across web, email, in-app, in-store and
  retail-media placements. The platform pairs a campaign builder with zero-party data collection, prize and
  voucher management, ESP/CRM/storage integrations, webhooks and campaign analytics. Programmatic access is
  delivered through a public REST API at api.playable.com documented with an OpenAPI 3.0 definition and secured
  with OAuth 2.0 client-credentials scoped per capability, plus a browser-side campaign SDK published to npm.
  API access is a Premium-plan entitlement; developer apps and credentials are created under Global settings.
