apis:
- name: Playable API
  description: >-
    Public REST API for the Playable gamification platform. Covers campaign types, campaign lifecycle
    (list, view, update, copy, delete, activate, pause, resume, clear cache), campaign sections and
    registration form fields, prizes and bulk prizes, vouchers, player registrations, email and SMS logs,
    game data statistics, session/registration analytics, game settings, media upload and login-token
    creation. OAuth 2.0 client-credentials with 37 fine-grained scopes; 3,600 requests per hour per
    developer app with X-RateLimit-* and Retry-After response headers.
  humanURL: https://api.playable.com/
  baseURL: https://api.playable.com
  tags:
