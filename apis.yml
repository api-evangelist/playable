- name: Playable MCP Server
  description: >-
    Hosted Model Context Protocol endpoint served from the Playable web property and advertised through
    RFC 9728 protected-resource metadata at playable.com/.well-known/oauth-protected-resource. Requires
    OAuth 2.0 authorization-code + PKCE (S256) with the `mcp` scope; an anonymous tools/list call returns
    401 mcp_unauthorized, so the tool set and input schemas are not enumerable without credentials.
  humanURL: https://playable.com/
  baseURL: https://playable.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - agent-native
  - marketing-gamification
  tags_raw:
  - mcp
  - agent-native
  - marketing-gamification
  properties:
  - type: MCPServer
    url: mcp/playable-mcp.yml
  - type: MCPServer
    url: https://playable.com/wp-json/mcp/mcp-oauth-server
  - type: ToolCrosswalk
    url: mcp/playable-tool-crosswalk.yml
  - type: WellKnown
    url: well-known/playable-well-known.yml
- name: Playable Campaign SDK
  description: >-
    Browser-side JavaScript SDK (`@playable-marketing/campaign-sdk`) that exposes a promise-based
    `window.sdk` object plus an event stream so a host page can listen to campaign events and read
    campaign context filtered by the viewer's permissions. Documented at sdk.playable.com.
  humanURL: https://sdk.playable.com/guide/introduction.html
  baseURL: https://sdk.playable.com
